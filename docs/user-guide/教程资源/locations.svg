<rect x="32" y="92" width="514" height="174" rx="12" fill="white" stroke="white" stroke-width="2"/>
<text x="56" y="137" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#245bd6">软件数据位置</text>
<text x="56" y="183" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#172b4d">保存你的库、设置和图片</text>
<text x="56" y="222" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#53647e">导入副本也会占用这里的空间</text>
