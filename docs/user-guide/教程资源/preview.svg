<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470">
<rect width="1120" height="470" fill="#edf3fc"/>
<text x="32" y="47" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#172b4d">04  选中、预览确认、应用是三步</text>
<rect x="928" y="20" width="160" height="42" rx="12" fill="#dce7fc" stroke="#dce7fc" stroke-width="2"/>
<text x="948" y="47" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#245bd6">操作示意</text>
<rect x="32" y="92" width="1056" height="336" rx="12" fill="white" stroke="white" stroke-width="2"/>
<rect x="56" y="122" width="274" height="174" rx="12" fill="#e5edff" stroke="#245bd6" stroke-width="2"/>
<text x="84" y="175" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#172b4d">壁纸 A</text>
<text x="84" y="235" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#245bd6">当前选中</text>
<rect x="352" y="122" width="274" height="174" rx="12" fill="#f1f5fa" stroke="#f1f5fa" stroke-width="2"/>
<text x="380" y="175" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#172b4d">壁纸 B</text>
<text x="380" y="235" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#227760">正在使用</text>
<text x="56" y="353" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#172b4d">选中 A 时，B 可以仍在播放。</text>
<text x="56" y="391" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#53647e">点“预览”或“设为桌面壁纸”后才执行切换。</text>
<rect x="708" y="122" width="348" height="46" rx="12" fill="#eaf0fa" stroke="#eaf0fa" stroke-width="2"/>
<text x="722" y="151" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#245bd6">1  预览</text>
<rect x="708" y="192" width="348" height="46" rx="12" fill="#eaf0fa" stroke="#eaf0fa" stroke-width="2"/>
<text x="722" y="221" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#245bd6">2  确认画面</text>
<rect x="708" y="262" width="348" height="46" rx="12" fill="#245bd6" stroke="#245bd6" stroke-width="2"/>
<text x="722" y="291" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="white">3  设为桌面壁纸</text>
<text x="710" y="355" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#53647e">在预览窗确认实际画面</text>
<text x="710" y="393" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#53647e">截图封面可另点“截取封面”</text></svg>
