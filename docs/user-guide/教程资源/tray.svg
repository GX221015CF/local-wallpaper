<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460">
<rect width="1120" height="460" fill="#edf3fc"/>
<text x="32" y="47" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#172b4d">05  隐藏后，从蓝色图标找回</text>
<rect x="928" y="20" width="160" height="42" rx="12" fill="#dce7fc" stroke="#dce7fc" stroke-width="2"/>
<text x="948" y="47" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#245bd6">操作示意</text>
<rect x="32" y="92" width="468" height="332" rx="12" fill="white" stroke="white" stroke-width="2"/>
<text x="58" y="144" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#172b4d">桌面播放时</text>
<rect x="58" y="178" width="416" height="46" rx="12" fill="#245bd6" stroke="#245bd6" stroke-width="2"/>
<text x="72" y="207" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="white">关闭界面，继续播放</text>
<text x="58" y="273" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#172b4d">在 Windows 通知区域查找图标</text>
<text x="58" y="311" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#53647e">折叠在小箭头里时，先展开面板</text>
<text x="58" y="381" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#245bd6">点图标  →  回到同一主界面</text>
<rect x="530" y="92" width="558" height="332" rx="12" fill="white" stroke="white" stroke-width="2"/>
<text x="558" y="144" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#172b4d">右键图标的菜单</text>
<text x="568" y="202" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#172b4d">打开主界面</text>
<text x="568" y="251" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#172b4d">选择 / 更换壁纸</text>
<text x="568" y="300" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#245bd6">停止播放并恢复原桌面</text>
<text x="568" y="349" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#172b4d">彻底退出</text>
<text x="558" y="400" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#53647e">菜单项目随当前运行状态启用</text></svg>
